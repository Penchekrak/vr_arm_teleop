<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR setup dashboard</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "urdf-loader": "https://cdn.jsdelivr.net/npm/urdf-loader@0.12.6/src/URDFLoader.js"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <section id="viewport"></section>
    <aside id="panel">
      <div class="panel-section">
        <h1>Setup Dashboard</h1>
        <div id="connection">Connecting</div>
      </div>
      <div class="panel-section">
        <h2>Layers</h2>
        <label><input id="toggle-robot" type="checkbox" checked> Robot</label>
        <label><input id="toggle-cloud" type="checkbox" checked> Point cloud</label>
        <label><input id="toggle-workspace" type="checkbox" checked> Workspace</label>
        <label><input id="toggle-xr" type="checkbox" checked> XR headset/hand</label>
        <label><input id="toggle-calibration" type="checkbox" checked> Calibration</label>
        <label><input id="toggle-cubes" type="checkbox" checked> Cubes</label>
      </div>
      <div class="panel-section">
        <h2>Control</h2>
        <div class="button-row">
          <button id="enable-control" type="button">Enable Control</button>
          <button id="disable-control" type="button" disabled>Disable</button>
        </div>
        <div class="button-row">
          <button id="adjust-workspace" type="button">Adjust Workspace</button>
          <button id="save-workspace" type="button" disabled>Save</button>
          <button id="cancel-workspace" type="button" disabled>Cancel</button>
        </div>
        <div class="segmented">
          <button data-workspace-mode="translate" type="button">Move</button>
          <button data-workspace-mode="rotate" type="button">Rotate</button>
          <button data-workspace-mode="scale" type="button">Size</button>
        </div>
        <div class="button-row">
          <button id="plan-grasp" type="button" disabled>Simulate Grasp</button>
          <button id="approve-grasp" type="button" disabled>Approve Move</button>
        </div>
        <div id="control-status" class="control-status">Control disabled</div>
      </div>
      <div class="panel-section">
        <h2>Cubes</h2>
        <div id="cube-list"></div>
      </div>
      <div class="panel-section">
        <h2>Calibration</h2>
        <button id="finish-calibration" type="button" disabled>Finish Calibration</button>
      </div>
      <div id="status"></div>
      <div id="calibration-feeds"></div>
    </aside>
  </main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
